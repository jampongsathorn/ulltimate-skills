name: Polymarket Follow Bot Cron Check

on:
  schedule:
    # รันเช็กทุกๆ 5 นาที (ความถี่สูงสุดของ GitHub Actions Cron)
    - cron: '*/5 * * * *'
  workflow_dispatch: # เปิดให้กดปุ่ม "Run workflow" แบบ Manual ได้เอง

permissions:
  contents: write

jobs:
  check-trades:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Polymarket Follow Bot Check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 polymarket_tracker.py \
            --follow-bot \
            --target "0x1387d145aaf01f6e33b66525dda6e1f51f6955f8" \
            --slug-group "highest-temp" \
            --webhook "$DISCORD_WEBHOOK_URL" \
            --lookback 25 \
            --once

      - name: Commit & Push Seen Trades Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_trades.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen trades cache [skip ci]" && git push)
