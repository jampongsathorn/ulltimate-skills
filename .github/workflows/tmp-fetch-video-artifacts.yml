name: tmp-fetch-video-artifacts

# TEMPORARY helper workflow (delete when done).
# Why it exists: the Arena sandbox that requested it cannot reach video hosts
# (its egress allowlist is limited to package registries + github.com), so this
# job downloads one public X/Twitter video on a runner that has full internet,
# extracts frames + a Thai transcript, and pushes everything to a throwaway
# branch: tmp-video-artifacts-2102770102517309525

on:
  push:
    paths:
      - '.github/workflows/tmp-fetch-video-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  OUT_BRANCH: tmp-video-artifacts-2102770102517309525
  VID_720: 'https://video.twimg.com/amplify_video/2102769959642492928/vid/avc1/720x1280/9cGs3E5qtolwXL6l.mp4?tag=29'
  VID_480: 'https://video.twimg.com/amplify_video/2102769959642492928/vid/avc1/480x852/0fPgIZXbRW7mA_yU.mp4?tag=29'
  VID_320: 'https://video.twimg.com/amplify_video/2102769959642492928/vid/avc1/320x568/MpYm22mr3jorlfOG.mp4?tag=29'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          set -x
          mkdir -p out
          (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-tha) > out/apt.log 2>&1 || echo "apt had issues" >> out/apt.log
          { which ffmpeg ffprobe tesseract; ffmpeg -version 2>&1 | head -3; tesseract --list-langs 2>&1 | head -20; } > out/tools.txt 2>&1 || true
          cat out/tools.txt

      - name: Download source video
        run: |
          set -x
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          ok=0
          for u in "$VID_720" "$VID_480" "$VID_320"; do
            echo "trying $u"
            if curl -fsS -L --retry 3 -A "$UA" -o /tmp/v.mp4 "$u"; then ok=1; echo "downloaded $u"; break; fi
          done
          { echo "ok=$ok"; ls -la /tmp/v.mp4 || true; file /tmp/v.mp4 || true; sha256sum /tmp/v.mp4 || true; } | tee out/download.txt
          [ "$ok" = "1" ] || exit 1
          cp /tmp/v.mp4 out/source_video.mp4 || true

      - name: Probe and extract frames
        run: |
          set -x
          mkdir -p out/frames
          ffprobe -v error -show_streams -show_format /tmp/v.mp4 > out/probe.txt 2> out/probe.err || echo "ffprobe failed" >> out/probe.txt
          ffmpeg -hide_banner -loglevel error -i /tmp/v.mp4 -vf "fps=1/2,scale=480:-2" -q:v 3 out/frames/f%03d.jpg > out/ffmpeg_frames.log 2>&1 || echo "frames failed" >> out/ffmpeg_frames.log
          ffmpeg -hide_banner -loglevel error -i /tmp/v.mp4 -vf "fps=1/2,crop=iw:ih*0.40:0:ih*0.60,scale=640:-2,tile=3x3" -q:v 2 out/sheet_captions_%02d.jpg > out/ffmpeg_sheets_cap.log 2>&1 || echo "caption sheets failed" >> out/ffmpeg_sheets_cap.log
          ffmpeg -hide_banner -loglevel error -i /tmp/v.mp4 -vf "fps=1/2,scale=300:-2,tile=5x5" -q:v 3 out/sheet_frames_%02d.jpg > out/ffmpeg_sheets_full.log 2>&1 || echo "full sheets failed" >> out/ffmpeg_sheets_full.log
          ls -la out out/frames > out/listing.txt 2>&1 || true
          cat out/listing.txt

      - name: OCR burned-in text (best effort)
        continue-on-error: true
        run: |
          set -x
          : > out/ocr_frames.txt
          for f in out/frames/*.jpg; do
            printf '\n--- %s ---\n' "$f" >> out/ocr_frames.txt
            tesseract "$f" - -l tha --psm 6 >> out/ocr_frames.txt 2>/dev/null || true
          done
          wc -l out/ocr_frames.txt || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Transcribe audio (faster-whisper)
        continue-on-error: true
        run: |
          set -x
          pip install -q faster-whisper 2>&1 | tail -3
          ffmpeg -hide_banner -loglevel error -i /tmp/v.mp4 -vn -ac 1 -ar 16000 /tmp/a.wav || echo "no audio track" > out/audio_note.txt
          cat > /tmp/tr.py <<'PY'
          import sys, os
          from faster_whisper import WhisperModel

          models = ["large-v3", "medium", "small"]
          for name in models:
              try:
                  print("loading", name, flush=True)
                  model = WhisperModel(name, device="cpu", compute_type="int8", cpu_threads=4)
                  print("using", name, flush=True)
                  break
              except Exception as e:
                  print("model failed", name, repr(e), flush=True)
                  model = None
          if model is None:
              sys.exit("no model could be loaded")

          segments, info = model.transcribe(
              "/tmp/a.wav", language="th", beam_size=5,
              vad_filter=True, vad_parameters=dict(min_silence_duration_ms=400),
          )
          out_name = "out/transcript.txt" if name == "large-v3" else "out/transcript_%s.txt" % name
          with open(out_name, "w", encoding="utf-8") as f:
              f.write("model=%s lang=%s prob=%.3f duration=%.2fs\n\n" % (name, info.language, info.language_probability, info.duration))
              for s in segments:
                  line = "[%7.2f-%7.2f] %s" % (s.start, s.end, s.text.strip())
                  print(line, flush=True)
                  f.write(line + "\n")
          print("wrote", out_name, flush=True)
          PY
          python /tmp/tr.py

      - name: Publish artifacts to throwaway branch
        if: always()
        run: |
          set -x
          mkdir -p out
          ls -la out
          git config user.name "arena-artifact-bot"
          git config user.email "arena-artifact-bot@users.noreply.github.com"
          git checkout -b "$OUT_BRANCH"
          git add -f out
          git commit -m "tmp: artifacts for tweet 2102770102517309525" || echo "nothing to commit"
          git push -u origin "$OUT_BRANCH" || echo "push failed"
